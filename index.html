<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgencyFlow Backend — En ligne</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,system-ui,sans-serif;background:#050A14;color:white;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
  .card{background:#0D1A2E;border:1px solid rgba(68,121,255,.25);border-radius:20px;padding:2.5rem 2rem;max-width:480px;width:100%;text-align:center}
  .status{display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .85rem;background:rgba(0,190,134,.12);border:1px solid rgba(0,190,134,.25);border-radius:20px;font-size:.72rem;font-weight:700;color:#00DFAA;margin-bottom:1.5rem}
  .dot{width:7px;height:7px;border-radius:50%;background:#00BE86;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  h1{font-size:1.8rem;font-weight:900;letter-spacing:-.03em;margin-bottom:.5rem}
  h1 span{color:#4479FF}
  .sub{font-size:.85rem;color:rgba(255,255,255,.5);margin-bottom:2rem;line-height:1.6}
  .routes{text-align:left;margin-bottom:1.5rem}
  .route-title{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:rgba(255,255,255,.3);margin-bottom:.65rem;font-family:monospace}
  .route{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:9px;margin-bottom:.4rem}
  .rm{font-size:.58rem;font-weight:700;font-family:monospace;padding:.12rem .4rem;border-radius:4px;white-space:nowrap}
  .get{background:rgba(0,190,134,.15);color:#00DFAA}
  .post{background:rgba(68,121,255,.15);color:#60A5FA}
  .rp{font-family:monospace;font-size:.72rem;color:rgba(255,255,255,.7);flex:1}
  .rd{font-size:.65rem;color:rgba(255,255,255,.3)}
  .test-btn{display:block;width:100%;padding:.75rem;background:linear-gradient(135deg,#4479FF,#2EB8FF);color:white;border:none;border-radius:11px;font-size:.88rem;font-weight:700;cursor:pointer;text-decoration:none;margin-bottom:.5rem;transition:all .15s}
  .test-btn:hover{opacity:.88;transform:translateY(-1px)}
  .client-btn{display:block;width:100%;padding:.75rem;background:rgba(0,190,134,.1);color:#00DFAA;border:1px solid rgba(0,190,134,.25);border-radius:11px;font-size:.88rem;font-weight:700;cursor:pointer;text-decoration:none;transition:all .15s}
  .client-btn:hover{background:rgba(0,190,134,.18)}
  .tr{margin-top:.75rem;padding:.65rem .85rem;border-radius:9px;font-size:.72rem;font-family:monospace;display:none;text-align:left;line-height:1.7;white-space:pre-wrap}
  .ok{background:rgba(0,190,134,.1);border:1px solid rgba(0,190,134,.2);color:#00DFAA}
  .err{background:rgba(255,64,96,.1);border:1px solid rgba(255,64,96,.2);color:#FF5070}
</style>
</head>
<body>
<div class="card">
  <div class="status"><div class="dot"></div> Serveur en ligne</div>
  <h1>Agency<span>Flow</span> Backend</h1>
  <p class="sub">Ton serveur API est deployed et opérationnel.<br>Teste la connexion ci-dessous.</p>
  <div class="routes">
    <div class="route-title">Endpoints disponibles</div>
    <div class="route"><span class="rm get">GET</span><span class="rp">/api/proxy</span><span class="rd">Proxy universel CORS</span></div>
    <div class="route"><span class="rm post">POST</span><span class="rp">/api/auth</span><span class="rd">Login / Register JWT</span></div>
    <div class="route"><span class="rm get">GET</span><span class="rp">/api/oauth</span><span class="rd">OAuth Meta / Shopify / Google</span></div>
    <div class="route"><span class="rm get">GET</span><span class="rp">/api/data</span><span class="rd">Données temps réel</span></div>
  </div>
  <button class="test-btn" onclick="testProxy()">🔌 Tester la connexion</button>
  <a href="/dashboard" class="client-btn">→ Dashboard client</a>
  <div id="tr" class="tr"></div>
</div>
<script>
async function testProxy(){
  const btn=document.querySelector('.test-btn');
  const r=document.getElementById('tr');
  btn.textContent='⟳ Test...';
  r.style.display='none';
  try{
    const res=await fetch('/api/proxy?url='+encodeURIComponent('https://httpbin.org/get'));
    const d=await res.json();
    r.className='tr ok';r.style.display='block';
    r.textContent='✅ Proxy opérationnel ! Status: '+res.status+'\nTon URL : '+window.location.origin+'\n\nColle cette URL dans le guide de déploiement.';
    btn.textContent='✅ Connexion OK';
  }catch(e){
    r.className='tr err';r.style.display='block';
    r.textContent='❌ '+e.message;
    btn.textContent='🔌 Tester la connexion';
  }
}
</script>
</body>
</html>
